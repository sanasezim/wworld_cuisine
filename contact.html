<main class="container py-5">


    <div class="row justify-content-center">

        <div class="col-lg-8 form-box p-4 p-md-5">


            <div class="mb-4">

                <p class="text-uppercase text-secondary fw-bold mb-2">
                    Contact
                </p>

                <h1 class="fw-bold">
                    Send a recommendation
                </h1>

                <p>
                    Recommend a cuisine,
                    dish or restaurant.
                </p>

            </div>



            <form class="row g-3">


                <div class="col-md-6">

                    <label
                        for="name"
                        class="form-label"
                    >
                        Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        required
                    >

                </div>



                <div class="col-md-6">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        required
                    >

                </div>



                <div class="col-md-6">

                    <label
                        for="cuisine"
                        class="form-label"
                    >
                        Cuisine
                    </label>

                    <select
                        class="form-select"
                        id="cuisine"
                    >

                        <option selected>
                            Choose...
                        </option>

                        <option>Kazakh</option>
                        <option>Italian</option>
                        <option>Japanese</option>
                        <option>Mexican</option>
                        <option>Indian</option>
                        <option>Korean</option>

                    </select>

                </div>



                <div class="col-md-6">

                    <label
                        for="dish"
                        class="form-label"
                    >
                        Dish
                    </label>


                    <div class="input-group">

                        <span class="input-group-text">
                            #
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            id="dish"
                            placeholder="Pizza"
                        >

                    </div>

                </div>



                <div class="col-12">

                    <label
                        for="message"
                        class="form-label"
                    >
                        Recommendation
                    </label>

                    <textarea
                        class="form-control"
                        id="message"
                        rows="5"
                        required
                    ></textarea>

                </div>



                <div class="col-12">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="confirm"
                        >

                        <label
                            class="form-check-label"
                            for="confirm"
                        >
                            I confirm my recommendation.
                        </label>

                    </div>

                </div>



                <div class="col-12">

                    <button
                        type="submit"
                        class="btn btn-dark"
                    >
                        Submit
                    </button>

                    <button
                        type="reset"
                        class="btn btn-outline-secondary"
                    >
                        Clear
                    </button>

                </div>


            </form>


        </div>

    </div>


</main>
