
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cuisine | Log In</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
<div id="scrollProgress"></div>
<div id="notification" role="status"></div>

<nav class="navbar navbar-expand-lg navbar-dark world-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">World Cuisine</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNavbar" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="countries.html">Countries</a></li>
                <li class="nav-item"><a class="nav-link" href="dishes.html">Dishes</a></li>
                <li class="nav-item"><a class="nav-link" href="recipes.html">Recipes</a></li>
                <li class="nav-item"><a class="nav-link" href="restaurants.html">Restaurants</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Sign up</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-3">
    <button id="themeBtn" type="button" class="btn btn-outline-dark">
        Night mode
    </button>
</div>

<main class="container py-5">
    <div class="row justify-content-center">
        <section class="col-lg-5 form-box p-4 p-md-5">
            <p class="eyebrow">Welcome back</p>
            <h1>Log in</h1>
            <p>Sign in to your World Cuisine account.</p>

            <form id="loginForm" class="row g-3" novalidate>
                <div class="col-12">
                    <label class="form-label" for="loginEmail">Email</label>
                    <input id="loginEmail" type="text" inputmode="email"
                           autocomplete="email" class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input id="loginPassword" type="password"
                           autocomplete="current-password" class="form-control">
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-dark w-100">
                        Log in
                    </button>
                </div>

                <p class="form-success" role="status" aria-live="polite"></p>
            </form>

            <p class="mt-4">
                New here?
                <a href="register.html">Create an account</a>
            </p>
        </section>
    </div>
</main>

<footer class="world-footer py-4 mt-5">
    <div class="container text-center">
        <p class="text-white mb-0">World Cuisine | SE-2504</p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
